# Strata on NVIDIA. Needs the NVIDIA Container Toolkit.
#
#   This host (2x Tesla V100):    cp .env.v100.example .env
#   Other host (RTX / Blackwell): cp .env.example .env
#   ./scripts/launch-docker.sh
#   docker compose logs -f
#
# cuda13 = RTX 20/30/40/50 and matching RTX PRO (driver 580+).
# cuda12 = Tesla V100 / P100 / GTX 10 (driver 575.51+). Do not mix them.
#
# Only one runner (native or Docker) should own the GPU at a time.
# restart is off so a reboot does not steal the card from another engine.

services:
  strata:
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.8-cuda12}
    container_name: strata
    restart: "no"
    ports:
      - "${STRATA_BIND:-127.0.0.1}:${STRATA_PORT:-8080}:8080"
    environment:
      FAMILY: ${FAMILY:-qwen}
      MODEL: ${MODEL:-IQ2_XS}
      MODEL_PATH: ${MODEL_PATH:-}
      CONTEXT: ${CONTEXT:-32k}
      PARALLEL: ${PARALLEL:-}
      VISION: ${VISION:-cpu}
      TUNE: ${TUNE:-skip}
      API_KEY: ${API_KEY:-}
      PORT: "8080"
      GPU: ${GPU:-0,1}
      GPUS: ${GPU:-0,1}
      GPU_ROLES: ${GPU_ROLES:-}
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    stop_grace_period: 2m
